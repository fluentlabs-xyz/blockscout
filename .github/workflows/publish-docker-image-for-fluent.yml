name: Publish Fluent-Dev Backend Docker Image

on:
  push:
    branches:
      - 'devel'
    tags:
      - 'v*.*.*'

  workflow_dispatch:

jobs:
  build_and_publish:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/fluentlabs-xyz/blockscout
          tags: |
            type=ref,event=tag
            type=sha,prefix=,suffix=,event=branch
            type=raw,value=latest,event=branch

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Add SHORT_SHA to environment
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BLOCKSCOUT_VERSION=v8.1.1.+commit.${{ env.SHORT_SHA }}
            RELEASE_VERSION=8.1.1
          cache-from: type=gha
          cache-to: type=gha,mode=max