version: '3.9'

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db
    volumes:
      - redis-data:/data

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init
    volumes:
      - db-data:/var/lib/postgresql/data

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 9.0.2
    links:
      - db:database
    environment:
      ETHEREUM_JSONRPC_HTTP_URL: http://host.docker.internal:8545/
      ETHEREUM_JSONRPC_TRACE_URL: http://host.docker.internal:8545/
      ETHEREUM_JSONRPC_WS_URL: ws://host.docker.internal:8545/
      CHAIN_ID: '20994'
      CHAIN_TYPE: ethereum
      MICROSERVICE_FLUENT_VERIFIER_URL: http://host.docker.internal:8050

  nft_media_handler:
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 9.0.2

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init
    volumes:
      - stats-db-data:/var/lib/postgresql/data
  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db
    volumes:
      - stats-db-data:/var/lib/postgresql/data

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer
  
  fluent-verifier:
    user: root
    image: ghcr.io/fluentlabs-xyz/fluent-verifier:adf2151374db5ce29e266d1d02c279d221a9da07
    container_name: fluent-verifier
    platform: linux/amd64
    ports:
      - "8050:8050"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - RUST_LOG=info
    volumes:
      - ~/.orbstack/run/docker.sock:/var/run/docker.sock


  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy

volumes:
  db-data:
  redis-data:
  stats-db-data:
