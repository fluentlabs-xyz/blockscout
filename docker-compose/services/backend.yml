version: "3.9"

services:
  backend:
    image: ${BLOCKSCOUT_BACKEND_DOCKER_IMAGE}:${BLOCKSCOUT_BACKEND_DOCKER_TAG}
    pull_policy: always
    restart: always
    stop_grace_period: 5m
    container_name: backend
    command: sh -c "bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env
    volumes:
      - ${BLOCKSCOUT_LOGS:-./logs/}:/app/logs/
      - ${BLOCKSCOUT_DETS:-./dets/}:/app/dets/
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
